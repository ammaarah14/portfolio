    <div style={{ width:20 }}>

    <div style={{ width:20 }}>{rightIcon}</div>

);

/* ─── Pill badge ─── */
const Pill = ({ type }) => {
  const map = {
    pass:     { bg:"#e3f3ea", color:PASS,  label:"Pass" },
    fail:     { bg:"#fbe8e7", color:FAIL,  label:"Not Yet Eligible" },

const EMBED = document.documentElement.classList.contains("embed");

function useFit(embed) {
  const [k, setK] = useState(1);
  useEffect(() => {
    if (!embed) return;
    const fit = () => setK(Math.min(1, (window.innerHeight - 8) / 660, (window.innerWidth - 8) / 340));
    fit();
    window.addEventListener("resize", fit);
    return () => window.removeEventListener("resize", fit);
  }, [embed]);
  return k;
}

function App() {
  const [screen, setScreen] = useState("splash");
  const fitK = useFit(EMBED);

  const navigate = (next) => setScreen(next);

  const renderScreen = () => {
    switch (screen) {
      case "splash":         return <SplashScreen navigate={navigate}/>;
      case "welcome":        return <WelcomeScreen navigate={navigate}/>;
      case "signin":         return <SignInScreen navigate={navigate}/>;
      case "verify":         return <VerifyScreen navigate={navigate}/>;
      case "verify-loading": return <VerifyLoadingScreen navigate={navigate}/>;
      case "verify-fail":    return <VerifyFailScreen navigate={navigate}/>;
      case "loading":        return <LoadingScreen navigate={navigate}/>;
      case "home":           return <HomeScreen navigate={navigate}/>;
      case "home-partial":   return <HomePartialScreen navigate={navigate}/>;
      case "notification":   return <NotificationScreen navigate={navigate}/>;
      case "results":        return <ResultsScreen navigate={navigate}/>;
      case "result-rsh":     return <ResultDetailScreen navigate={navigate} title="Revelation Spiritual Home Test" score="88%" date="14 Feb 2025"/>;
      case "result-ub":      return <ResultDetailScreen navigate={navigate} title="Ubukhosi Bomoya Test" score="91%" date="02 Mar 2025"/>;
      case "letters":        return <LettersScreen navigate={navigate}/>;
      case "letter-preview": return <LetterPreviewScreen navigate={navigate}/>;
      case "profile":        return <ProfileScreen navigate={navigate}/>;
      case "support":        return <SupportScreen navigate={navigate}/>;
      case "contact":        return <ContactScreen navigate={navigate}/>;
      case "error":          return <ErrorScreen navigate={navigate}/>;
      default:               return <HomeScreen navigate={navigate}/>;
    }
  };

  const current = ALL_SCREENS.find(s => s.key === screen);

  return (
    <div style={{ minHeight:"100vh", background: EMBED ? "transparent" : "#f0f2f7", display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center", padding: EMBED ? 0 : "64px 16px 32px" }}>

      {/* Header */}
      {!EMBED && <div style={{ marginBottom:20, textAlign:"center" }}>
        <div style={{ fontSize:11, fontWeight:700, letterSpacing:2, color:GOLD, marginBottom:4 }}>TRSH RESULTS PORTAL</div>
        <div style={{ fontSize:13, color:"#6b6f76" }}>
          Interactive Prototype · <span style={{ color:NAVY, fontWeight:600 }}>{current?.label}</span>
        </div>
      </div>}

      {/* Phone frame */}
      <div style={{ width:320, height:640, background:"#111", borderRadius:42, padding:10,
        boxShadow:"0 20px 60px rgba(15,29,82,.28), 0 0 0 1px rgba(255,255,255,.08)", position:"relative",
        ...(EMBED ? { transform:`scale(${fitK})`, transformOrigin:"center center", flex:"none" } : {}) }}>
        <div style={{ position:"absolute", top:10, left:"50%", transform:"translateX(-50%)",
          width:90, height:18, background:"#111", borderRadius:"0 0 12px 12px", zIndex:10 }}/>
        <div style={{ width:"100%", height:"100%", background:"#fff", borderRadius:32,
          overflow:"hidden", display:"flex", flexDirection:"column", position:"relative" }}>
          {renderScreen()}
        </div>
      </div>

      {/* Jump-to pills */}
      {!EMBED && <div style={{ marginTop:28, width:340 }}>
        <div style={{ fontSize:11, fontWeight:700, letterSpacing:1.5, color:"#9a9da3", marginBottom:10, textAlign:"center" }}>
          JUMP TO SCREEN
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, justifyContent:"center" }}>
          {ALL_SCREENS.map(s => (
            <button key={s.key} onClick={() => setScreen(s.key)}
              style={{ fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:20,
                border:`1.5px solid ${screen===s.key ? NAVY : "#dcdfe6"}`,
                background: screen===s.key ? NAVY : "#fff",
                color: screen===s.key ? "#fff" : "#6b6f76",
                cursor:"pointer", transition:"all 0.15s ease" }}>
              {s.label}
            </button>
          ))}
        </div>
      </div>}

      {!EMBED && <div style={{ marginTop:24, fontSize:11, color:"#c0c3cc" }}>
        TRSH Results Portal · Interactive Prototype · Revelation Spiritual Home &amp; MSRI
      </div>}
    </div>
  );
}
